[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-test-lab"
version = "0.1.0"
description = "Synthetic test-automation laboratory for reliable DUT control and evidence generation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jared Mahotiere" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
# Build tooling for the C++ DUT (cpp/).  Installed from PyPI so the build
# system is pinned per-checkout and needs no admin rights; the compiler and
# debugger themselves still come from the platform (g++/clang++/MSVC, gdb).
cpp = [
    "cmake>=3.28",
    "ninja>=1.11",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["testlab*", "simulator*", "learning*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "requirement(identifier): links a test to a software requirement",
    "port_parity: cross-DUT parity for commands the course has you add (fails between Day 2 and Day 11 by design)",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", ".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "simulator", "learning"]

[tool.coverage.run]
source = ["testlab", "simulator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
