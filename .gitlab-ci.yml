default:
  image: python:3.12-bookworm
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - evidence/

stages:
  - quality
  - test
  - native

quality:
  stage: quality
  script:
    - ruff check src simulator tests learning
    - ruff format --check src simulator tests learning
    - mypy src simulator learning

test:
  stage: test
  script:
    - mkdir -p evidence/junit evidence/logs
    - pytest -v --junitxml=evidence/junit/test-results.xml --cov=testlab --cov=simulator --cov-report=xml:evidence/coverage.xml
  artifacts:
    reports:
      junit: evidence/junit/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: evidence/coverage.xml

# The C++ DUT and its CTest suite, then the protocol tests driven against it.
# The base image has no compiler, so this job installs one; that is also why
# it is a separate stage rather than more steps in `test`.
native:
  stage: native
  before_script:
    - apt-get update && apt-get install -y build-essential cmake gdb
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
  script:
    - mkdir -p evidence/junit evidence/logs
    - cmake -S cpp -B cpp/build
    - cmake --build cpp/build
    - ctest --test-dir cpp/build -C Debug --output-on-failure
    - pytest -v --dut cpp tests/test_status.py tests/test_protocol.py --junitxml=evidence/junit/test-results-cpp.xml
    - pytest -v tests/test_cpp_dut.py --junitxml=evidence/junit/test-results-parity.xml
  artifacts:
    reports:
      junit:
        - evidence/junit/test-results-cpp.xml
        - evidence/junit/test-results-parity.xml
