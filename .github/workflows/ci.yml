name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,cpp]'

      - name: Install debugger
        run: sudo apt-get update && sudo apt-get install -y gdb

      - name: Build the C++ DUT
        run: |
          cmake -S cpp -B cpp/build
          cmake --build cpp/build

      - name: Run CTest
        run: ctest --test-dir cpp/build -C Debug --output-on-failure

      - name: Lint
        run: ruff check src simulator tests learning

      - name: Check formatting
        run: ruff format --check src simulator tests learning

      - name: Type check
        run: mypy src simulator learning

      - name: Run tests
        run: |
          mkdir -p evidence/junit evidence/logs
          pytest -v \
            --junitxml=evidence/junit/test-results.xml \
            --cov=testlab \
            --cov=simulator \
            --cov-report=term-missing \
            --cov-report=xml:evidence/coverage.xml

      # The protocol suite must hold against the native DUT as well, not just
      # the Python one — that is what REQ-CPP-001 claims.
      - name: Run the protocol suite against the C++ DUT
        run: |
          pytest -v --dut cpp tests/test_status.py tests/test_protocol.py \
            --junitxml=evidence/junit/test-results-cpp.xml

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: evidence/
          if-no-files-found: error
