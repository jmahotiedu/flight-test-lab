name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check src simulator tests

      - name: Check formatting
        run: ruff format --check src simulator tests

      - name: Type check
        run: mypy src simulator

      - name: Run tests
        run: |
          mkdir -p evidence/junit evidence/logs
          pytest -v \
            --junitxml=evidence/junit/test-results.xml \
            --cov=testlab \
            --cov=simulator \
            --cov-report=term-missing \
            --cov-report=xml:evidence/coverage.xml

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: evidence/
          if-no-files-found: error
